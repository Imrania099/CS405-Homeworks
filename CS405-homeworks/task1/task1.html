<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    </style>
</head>
<body>
    <form >
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Name">
        </div>
        <div>
            <label for="favnumber">Fav number:</label>
            <input type="text" id="favnumber" name="favnumber">
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
        </div>
        <div>
            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male" style="width: auto;">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female" style="width: auto;">Female</label>
        </div>
        <div>
            <label for="country">Country:</label>
            <select id="country" name="country">
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="Canada">Turkiye</option>
                <option value="Australia">Azer</option>
                <option value="Germany">Germany</option>
                <option value="France">France</option>
                <option value="Japan">Japan</option>
                <option value="China">China</option>
                <option value="India">India</option>
                <option value="Brazil">Brazil</option>
            </select>
        </div>
        <div>
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" cols="40"></textarea>
        </div>
        <div>
            <label for="newsletter">Subscribe to newsletter:</label>
            <input type="checkbox" id="newsletter" name="newsletter">
        </div>
        <div>
            <label for="file">Upload file:</label>
            <input type="file" id="file" name="file">
        </div>
        <div>
            <label for="birthdate">Birthdate:</label>
            <input type="date" id="birthdate" name="birthdate">
        </div>
        <div>
            <label for="color">Favorite Color:</label>
            <input type="color" id="color" name="color">
        </div>
        <div>
            <label for="website">Personal Website:</label>
            <input type="url" id="website" name="website">
        </div>
        <div>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>
    </form>

    <style>
        body {
            font-family: Arial, sans-serif;
        }
        label {
            display: inline-block;
            width: 120px;
            margin-bottom: 10px;
        }
        textarea {
            vertical-align: top;
        }
        input[type="submit"], input[type="reset"] {
            margin-top: 10px;
            margin-right: 5px;
        }
    </style>

</body>
</html>
